<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт рабочего времени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6ecef;      /* холодный серо-голубой фон, как стена у табельных часов */
    --panel: #f6f8f9;
    --ink: #1e2b33;
    --muted: #5b6a74;
    --line: #c7d2d8;
    --run: #0b7a5c;     /* работа */
    --break: #2a78d6;   /* перерыв — полоски и метки */
    --lunch: #a35c00;   /* обед */
    --break-ink: #1c5cab; /* перерыв — для текста (контраст выше) */
    /* Тройка работа / перерыв / обед проверена на различимость, в т. ч. при
       нарушениях цветовосприятия (валидатор палитры, все проверки пройдены). */
    --stop: #b42318;    /* «стоп» и ошибки */
    --focus: #2457c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .now-working { color: var(--muted); margin: 0; }
  .now-working strong { color: var(--run); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h2 { font-size: 19px; font-weight: 600; margin: 0 0 14px; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], input[type=date] {
    font: inherit; color: inherit; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; min-width: 0;
  }
  input[type=text] { flex: 1 1 180px; }
  button {
    font: inherit; font-weight: 500; border: 0; border-radius: 6px; padding: 8px 16px;
    cursor: pointer; color: #fff; background: var(--ink); white-space: nowrap;
  }
  button.start { background: var(--run); }
  button.stop { background: var(--stop); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--muted); }
  button:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .error { color: var(--stop); min-height: 1.5em; margin: 6px 0 0; font-size: 15px; }
  .empty { color: var(--muted); margin: 8px 0 0; }

  /* Строка сотрудника — «карточка табеля» */
  .people { list-style: none; margin: 18px 0 0; padding: 0; }
  .person { padding: 14px 0; border-top: 1px solid var(--line); }
  .person-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .person-name { font-weight: 600; }
  .status { font-size: 14px; color: var(--muted); }
  .person.running .status { color: var(--run); }
  .person form { margin-top: 8px; }
  .person .error { min-height: 0; margin: 4px 0 0; }  /* место под ошибку — только когда она есть */
  .running-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  /* Единственный громкий элемент страницы — идущие часы */
  .clock { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; color: var(--run); line-height: 1.1; }
  .task { color: var(--muted); flex: 1 1 160px; overflow-wrap: anywhere; }
  .clock.kind-break, .person.kind-break .status { color: var(--break-ink); }
  .clock.kind-lunch, .person.kind-lunch .status { color: var(--lunch); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .clock-box { display: flex; flex-direction: column; }
  .clock-label { font-size: 13px; color: var(--muted); }
  .clock.frozen { color: var(--muted); }   /* работа на паузе: часы стоят */
  .pause-clock { font-size: 15px; font-variant-numeric: tabular-nums; }
  .pause-clock.kind-break { color: var(--break-ink); }
  .pause-clock.kind-lunch { color: var(--lunch); }
  .day-line { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .pauses { display: block; font-size: 13px; color: var(--muted); }

  /* Отчёт */
  .period { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .period label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); gap: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); font-size: 14px; border-top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 600; border-top: 2px solid var(--ink); }
  details summary { cursor: pointer; }
  details ul { margin: 6px 0 2px; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .live { color: var(--run); }
  .count { display: block; font-size: 13px; color: var(--muted); }

  /* «Забытый таймер» — служебное предупреждение: значок + текст, не только цвет */
  .warning { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; padding: 8px 10px;
             background: #fdecea; color: #7a1a12; border-radius: 6px; font-size: 14px; }
  .warning-icon { font-weight: 600; }
  .flag { color: #7a1a12; font-weight: 500; }
  .warning-body { display: flex; flex-direction: column; gap: 8px; }
  .warning button.ghost { align-self: flex-start; background: #fff; }
  form.extend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  form.extend select { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; background: #fff; }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  /* Лента дня */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 14px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
                         margin-right: 6px; vertical-align: -1px; background: var(--swatch); }
  td.lanes { border-top: 0; padding-top: 0; }
  .lane { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; margin: 3px 0; }
  .lane-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .track { position: relative; height: 14px; background: #e3e9ec; border-radius: 4px; }
  .seg { position: absolute; top: 0; bottom: 0; border-radius: 3px;
         border-left: 1px solid var(--panel); border-right: 1px solid var(--panel); }  /* 2px зазор между кусками */
  .seg.kind-work { background: var(--run); }
  .seg.kind-break { background: var(--break); }
  .seg.kind-lunch { background: var(--lunch); }
  .now-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
  .axis { position: relative; height: 16px; margin-left: 60px;  /* = подпись даты 52px + зазор 8px */ font-size: 11px; color: var(--muted); }
  .axis span { position: absolute; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Учёт рабочего времени</h1>
    <p class="now-working" id="now-working"></p>
  </header>

  <main>
    <section aria-labelledby="people-title">
      <h2 id="people-title">Сотрудники</h2>
      <form class="inline" id="add-form">
        <input type="text" id="new-name" placeholder="Имя и фамилия" maxlength="100" aria-label="Имя нового сотрудника" required>
        <button type="submit">Добавить сотрудника</button>
      </form>
      <p class="error" id="add-error" role="alert"></p>
      <p class="empty" id="people-empty" hidden>Пока никого нет. Добавьте первого сотрудника — и сможете запускать его таймер.</p>
      <ul class="people" id="people"></ul>
    </section>

    <section aria-labelledby="report-title">
      <h2 id="report-title">Отчёт за период</h2>
      <form class="period" id="report-form">
        <label>С <input type="date" id="date-from" required></label>
        <label>По <input type="date" id="date-to" required></label>
        <button type="submit">Показать отчёт</button>
      </form>
      <p class="error" id="report-error" role="alert"></p>
      <div id="report"></div>
    </section>
  </main>
</div>

<script src="/static/timeline.js"></script>
<script>
"use strict";
// Весь пользовательский текст выводится через textContent — не через innerHTML.
// Так имя с HTML-тегами покажется буквами и не выполнится.
// ВНИМАНИЕ: внутри этого блока нельзя писать закрывающий тег скрипта даже в комментарии —
// браузер решит, что скрипт закончился, и остальной код не выполнится (была такая ошибка).

const $ = (id) => document.getElementById(id);

// Часы идущих таймеров считаем от данных сервера, а не от часов компьютера:
// сервер прислал «прошло N секунд» в момент fetchedAt, дальше просто прибавляем.
let running = [];      // [{ element, baseSeconds, fetchedAt }]

function formatClock(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function formatHours(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if (totalSeconds > 0 && totalSeconds < 60) return "меньше минуты";  // иначе «0 мин» читается как «не было»
  if (h === 0) return `${m} мин`;
  return `${h} ч ${String(m).padStart(2, "0")} мин`;
}

// Как называть состояние сотрудника в зависимости от типа идущей записи.
const KIND_STATUS = { work: "работает с", break: "на перерыве с", lunch: "на обеде с" };
const KIND_LABEL = { work: "", break: "Перерыв", lunch: "Обед" };
const KIND_NAME = { work: "Работа", break: "Перерыв", lunch: "Обед" };

// Русские окончания: 1 запись, 2 записи, 5 записей.
function plural(n, one, few, many) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}

function clockTime(date) {
  return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function formatTime(iso) {
  return new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  return node;
}

// Запрос к API; при ошибке — понятный текст из ответа сервера.
async function api(method, url, body) {
  const response = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => null);
  if (!response.ok) {
    let message = `Ошибка ${response.status}`;
    if (data && typeof data.detail === "string") message = data.detail;
    else if (response.status === 422) message = "Проверьте ввод: поле пустое или слишком длинное";
    throw new Error(message);
  }
  return data;
}

// ---------- Сотрудники ----------

// Местная полночь: от неё сервер считает «отработано сегодня».
function localMidnightISO() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
}

async function loadEmployees() {
  const params = new URLSearchParams({ since: localMidnightISO() });
  const employees = await api("GET", `/api/employees?${params}`);
  const fetchedAt = Date.now();
  const list = $("people");
  list.replaceChildren();
  running = [];
  $("people-empty").hidden = employees.length > 0;

  const workingNow = employees.filter((e) => e.active_entry && e.active_entry.kind === "work").length;
  const pausedNow = employees.filter((e) => e.active_entry && e.active_entry.kind !== "work").length;
  $("now-working").replaceChildren();
  if (employees.length) {
    $("now-working").append("Сейчас работают: ", el("strong", {}, `${workingNow} из ${employees.length}`));
    if (pausedNow) $("now-working").append(`, на перерыве или обеде: ${pausedNow}`);
  }

  for (const employee of employees) list.append(renderEmployee(employee, fetchedAt));
}

function renderEmployee(employee, fetchedAt) {
  const entry = employee.active_entry;
  const item = el("li", { class: entry ? `person running kind-${entry.kind}` : "person" });
  const head = el("div", { class: "person-head" });
  head.append(el("span", { class: "person-name" }, employee.name),
              el("span", { class: "status" },
                 entry ? `${KIND_STATUS[entry.kind]} ${formatTime(entry.started_at)}` : "не на таймере"));
  item.append(head);
  const error = el("p", { class: "error", role: "alert" });

  if (entry) {
    const row = el("div", { class: "running-row" });
    // Большие часы — «отработано сегодня»: сумма всей работы за день.
    // Во время перерыва и обеда они стоят (рабочее время не идёт).
    const working = entry.kind === "work";
    const clockBox = el("div", { class: "clock-box" });
    const clock = el("span", { class: working ? "clock" : "clock frozen", "aria-live": "off" },
                     formatClock(employee.today.work_seconds));
    clockBox.append(el("span", { class: "clock-label" }, "отработано сегодня"), clock);
    if (working) {
      running.push({ element: clock, baseSeconds: employee.today.work_seconds, fetchedAt });
    } else {
      // Пока идёт перерыв или обед — его собственные маленькие часы.
      const pauseClock = el("span", { class: `pause-clock kind-${entry.kind}` },
                            `${KIND_LABEL[entry.kind]}: ${formatClock(entry.duration_seconds)}`);
      clockBox.append(pauseClock);
      running.push({ element: pauseClock, baseSeconds: entry.duration_seconds, fetchedAt,
                     prefix: `${KIND_LABEL[entry.kind]}: ` });
    }
    const actions = el("div", { class: "actions" });
    // Кнопка переключения: закрывает текущую запись и сразу открывает новую.
    const switchButton = (label, kind, cls) => {
      const button = el("button", { type: "button", class: cls }, label);
      button.addEventListener("click", () => act(button, error, () =>
        api("POST", `/api/employees/${employee.id}/timer/switch`, { kind })));
      return button;
    };
    if (entry.kind === "work") {
      actions.append(switchButton("Перерыв", "break", "ghost"), switchButton("Обед", "lunch", "ghost"));
    } else {
      actions.append(switchButton("Вернуться к работе", "work", "start"));
    }
    const stop = el("button", { type: "button", class: "stop" }, "Закончить");
    stop.addEventListener("click", () => act(stop, error, () =>
      api("POST", `/api/employees/${employee.id}/timer/stop`)));
    actions.append(stop);
    row.append(clockBox, el("span", { class: "task" }, working ? entry.description : "работа на паузе"), actions);
    item.append(row);
    if (entry.is_too_long) item.append(longTimerWarning(entry, error));
    if (entry.approved_by) {
      item.append(el("p", { class: "note" },
        `Рабочий день продлён до ${clockTime(new Date(entry.stops_at))}, подтвердил(а): ${entry.approved_by}`));
    }
    item.append(dayLine(employee.today, false));
  } else {
    const form = el("form", { class: "inline" });
    const input = el("input", { type: "text", placeholder: "Над чем работаете?", maxlength: "500",
                                "aria-label": `Задача для: ${employee.name}`, required: "" });
    const start = el("button", { type: "submit", class: "start" }, "Начать работу");
    form.append(input, start);
    if (employee.today.work_seconds || employee.today.break_seconds || employee.today.lunch_seconds) {
      item.append(dayLine(employee.today, true));
    }
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      act(start, error, () => api("POST", `/api/employees/${employee.id}/timer/start`,
                                  { kind: "work", description: input.value }));
    });
    item.append(form);
  }
  item.append(error);
  return item;
}

// Предупреждение «таймер идёт слишком долго» — похоже, забыли нажать «Закончить».
// Плюс кнопка продления: если сотрудник правда задерживается, руководитель
// подтверждает — иначе через 12 часов таймер остановится сам.
function longTimerWarning(entry, errorNode) {
  const box = el("div", { class: "warning", role: "status" });
  const body = el("div", { class: "warning-body" });
  body.append(el("span", {}, `Таймер идёт с ${formatTime(entry.started_at)} — больше 10 часов. ` +
                            "Возможно, забыли нажать «Закончить». " +
                            `Если не продлить, он остановится сам в ${clockTime(new Date(entry.stops_at))}.`));
  const open = el("button", { type: "button", class: "ghost" }, "Продлить рабочий день");
  open.addEventListener("click", () => {
    open.replaceWith(extendForm(entry, errorNode));
  });
  body.append(open);
  box.append(el("span", { class: "warning-icon", "aria-hidden": "true" }, "⚠"), body);
  return box;
}

// Форма продления: имя руководителя и на сколько часов.
// Входа по паролю нет (задание его не требует) — поэтому подтверждение
// записывается именем, а не проверкой роли. В настоящей системе нужен вход.
function extendForm(entry, errorNode) {
  const form = el("form", { class: "extend" });
  const who = el("input", { type: "text", placeholder: "Имя руководителя", maxlength: "100",
                            "aria-label": "Имя руководителя", required: "" });
  const hours = el("select", { "aria-label": "На сколько продлить" });
  for (const h of [2, 4, 6]) {
    if (entry.limit_hours + h <= 24) hours.append(el("option", { value: String(h) }, `+${h} ч`));
  }
  const confirm = el("button", { type: "submit", class: "start" }, "Подтвердить продление");
  form.append(who, hours, confirm);
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    act(confirm, errorNode, () => api("POST", `/api/entries/${entry.id}/extend`,
                                       { approved_by: who.value, hours: Number(hours.value) }));
  });
  setTimeout(() => who.focus(), 0);
  return form;
}

// Строка итогов дня под сотрудником.
function dayLine(today, withWork) {
  const parts = [];
  if (withWork) parts.push(`сегодня отработано ${formatHours(today.work_seconds)}`);
  if (today.break_seconds) parts.push(`перерывы ${formatHours(today.break_seconds)}`);
  if (today.lunch_seconds) parts.push(`обед ${formatHours(today.lunch_seconds)}`);
  const line = el("p", { class: "day-line" }, parts.length ? (withWork ? "" : "сегодня: ") + parts.join(", ") : "");
  return line;
}

// Общая обёртка для кнопок: блокируем на время запроса, показываем ошибку, обновляем экран.
async function act(button, errorNode, request) {
  button.disabled = true;
  errorNode.textContent = "";
  try {
    await request();
    await loadEmployees();
    if ($("report").childElementCount) await loadReport();
  } catch (error) {
    errorNode.textContent = error.message;
    button.disabled = false;
  }
}

$("add-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = event.submitter;
  button.disabled = true;
  $("add-error").textContent = "";
  try {
    await api("POST", "/api/employees", { name: $("new-name").value });
    $("new-name").value = "";
    await loadEmployees();
  } catch (error) {
    $("add-error").textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

setInterval(() => {
  const now = Date.now();
  for (const timer of running) {
    const seconds = timer.baseSeconds + Math.floor((now - timer.fetchedAt) / 1000);
    timer.element.textContent = (timer.prefix || "") + formatClock(seconds);
  }
}, 1000);

// ---------- Отчёт ----------

// Даты из полей — это местные сутки. Начало: полночь первого дня по местному
// времени; конец: полночь дня ПОСЛЕ последнего. Отправляем с поясом (toISOString даёт UTC).
function periodFromInputs() {
  const [fy, fm, fd] = $("date-from").value.split("-").map(Number);
  const [ty, tm, td] = $("date-to").value.split("-").map(Number);
  const start = new Date(fy, fm - 1, fd);
  const end = new Date(ty, tm - 1, td + 1);
  return { start, end };
}

async function loadReport() {
  $("report-error").textContent = "";
  const { start, end } = periodFromInputs();
  if (end <= start) {
    $("report-error").textContent = "Дата «по» не может быть раньше даты «с»";
    return;
  }
  const params = new URLSearchParams({ start: start.toISOString(), end: end.toISOString() });
  const report = await api("GET", `/api/report?${params}`);
  renderReport(report, start, end, new Date());
}

// Полоски дня одного сотрудника на общей шкале часов.
function renderLanes(entries, start, end, now, scale, shownDays) {
  const lanes = buildLanes(entries, start, end, now);
  const box = document.createDocumentFragment();
  const span = scale.windowEnd - scale.windowStart;
  const multiDay = shownDays.size > 1;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  for (const day of lanes.days) {
    if (!shownDays.has(day.date.getTime())) continue;  // день без записей у всех — пропускаем
    const row = el("div", { class: "lane" });
    const label = multiDay ? day.date.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "2-digit" }) : "";
    const track = el("div", { class: "track" });
    const described = [];
    for (const seg of day.segments) {
      const left = ((seg.from - scale.windowStart) / span) * 100;
      const width = ((seg.to - seg.from) / span) * 100;
      const text = `${KIND_NAME[seg.kind]} ${clockTime(seg.start)}–${clockTime(seg.end)}` +
                   (seg.kind === "work" ? ` · ${seg.description}` : "");
      const piece = el("div", { class: `seg kind-${seg.kind}`, title: text });
      piece.style.left = `${left}%`;
      piece.style.width = `${Math.max(width, 0.4)}%`;  // очень короткий кусок всё равно виден
      track.append(piece);
      described.push(text);
    }
    if (day.date.getTime() === today) {
      const hours = (now - day.date) / 3600000;
      if (hours >= scale.windowStart && hours <= scale.windowEnd) {
        const mark = el("div", { class: "now-mark", title: `Сейчас ${clockTime(now)}` });
        mark.style.left = `${((hours - scale.windowStart) / span) * 100}%`;
        track.append(mark);
      }
    }
    // Для экранного диктора — та же лента словами.
    track.setAttribute("role", "img");
    track.setAttribute("aria-label", described.length ? described.join("; ") : "Записей нет");
    row.append(el("span", { class: "lane-date" }, label), track);
    box.append(row);
  }
  return box;
}

function renderAxis(scale) {
  const axis = el("div", { class: "axis", "aria-hidden": "true" });
  const span = scale.windowEnd - scale.windowStart;
  const step = span > 12 ? 3 : 2;
  for (let h = Math.ceil(scale.windowStart / step) * step; h <= scale.windowEnd; h += step) {
    const tick = el("span", {}, `${h}:00`);
    tick.style.left = `${((h - scale.windowStart) / span) * 100}%`;
    axis.append(tick);
  }
  return axis;
}

function renderReport(report, start, end, now) {
  const box = $("report");
  box.replaceChildren();
  if (!report.employees.length) {
    box.append(el("p", { class: "empty" }, "Сотрудников пока нет — отчёт пуст."));
    return;
  }
  if (report.total_seconds === 0) {
    box.append(el("p", { class: "empty" }, "За этот период записей нет — у всех ноль."));
  }
  // Общая шкала часов для всех сотрудников — чтобы полосы можно было сравнивать.
  const allEntries = report.employees.flatMap((row) => row.entries);
  const scale = buildLanes(allEntries, start, end, now);
  if (scale.tooLong) {
    box.append(el("p", { class: "empty" }, "Лента дня показывается для периода до 14 дней."));
  } else {
    const legend = el("div", { class: "legend" });
    for (const [kind, color] of [["work", "--run"], ["break", "--break"], ["lunch", "--lunch"]]) {
      const item = el("span", {}, KIND_NAME[kind]);
      item.style.setProperty("--swatch", `var(${color})`);
      legend.append(item);
    }
    box.append(legend);
  }
  const shownDays = scale.tooLong ? new Set() : activeDays(scale);
  const table = el("table");
  const head = el("tr");
  head.append(el("th", {}, "Сотрудник"), el("th", { class: "num" }, "Работа"));
  table.append(head);
  if (!scale.tooLong) {
    // Шкала часов — сразу над первой полосой, в той же сетке, что и полосы.
    const axisRow = el("tr");
    const axisCell = el("td", { class: "lanes", colspan: "2" });
    axisCell.append(renderAxis(scale));
    axisRow.append(axisCell);
    table.append(axisRow);
  }

  for (const row of report.employees) {
    const tr = el("tr");
    const who = el("td");
    if (row.entries.length) {
      const details = el("details");
      const summary = el("summary", {}, row.name);
      const n = row.entries.length;
      summary.append(el("span", { class: "count" }, `${n} ${plural(n, "запись", "записи", "записей")}`));
      details.append(summary);
      const ul = el("ul");
      for (const entry of row.entries) {
        const end = entry.is_running ? "сейчас" : formatTime(entry.ended_at);
        const what = KIND_LABEL[entry.kind] || entry.description;
        const li = el("li", {}, `${formatTime(entry.started_at)} – ${end} · ${what}`);
        if (entry.is_running) li.append(" ", el("span", { class: "live" }, "(идёт)"));
        if (entry.is_too_long) li.append(" ", el("span", { class: "flag" }, "⚠ больше 10 ч — проверьте"));
        if (entry.needs_review) {
          li.append(" ", el("span", { class: "flag" },
            `⏹ остановлен автоматически через ${entry.limit_hours} ч — уточните время`));
        }
        if (entry.approved_by) li.append(" ", el("span", { class: "count" }, `продлено, подтвердил(а): ${entry.approved_by}`));
        ul.append(li);
      }
      details.append(ul);
      who.append(details);
    } else {
      who.textContent = row.name;
    }
    const time = el("td", { class: "num" }, formatHours(row.total_seconds));
    time.append(pausesLine(row));
    tr.append(who, time);
    table.append(tr);
    if (!scale.tooLong) {
      const lanesRow = el("tr");
      const cell = el("td", { class: "lanes", colspan: "2" });
      cell.append(renderLanes(row.entries, start, end, now, scale, shownDays));
      lanesRow.append(cell);
      table.append(lanesRow);
    }
  }
  const total = el("tr", { class: "total" });
  const totalTime = el("td", { class: "num" }, formatHours(report.total_seconds));
  totalTime.append(pausesLine(report));
  total.append(el("td", {}, "Итого работы"), totalTime);
  table.append(total);
  box.append(table);
}

// Подпись под временем: перерывы и обед — если они были.
function pausesLine(row) {
  const parts = [];
  if (row.break_seconds) parts.push(`перерывы ${formatHours(row.break_seconds)}`);
  if (row.lunch_seconds) parts.push(`обед ${formatHours(row.lunch_seconds)}`);
  return el("span", { class: "pauses" }, parts.join(", "));
}

$("report-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  try { await loadReport(); } catch (error) { $("report-error").textContent = error.message; }
});

// Старт: по умолчанию — отчёт за сегодня.
const today = new Date();
const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
$("date-from").value = iso;
$("date-to").value = iso;
loadEmployees().catch((error) => { $("add-error").textContent = `Не удалось загрузить сотрудников: ${error.message}`; });
</script>
